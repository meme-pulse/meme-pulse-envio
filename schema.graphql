# For user point? statistic
type UserTokenDayData @entity {
  id: ID! # chainId:userAddress:tokenAddress:date
  chainId: Int! @indexed
  timestamp: Int!
  user: User!
  token: Token!
  volumeUSD: BigDecimal!
  feesEarnedUSD: BigDecimal!
  feesPaidUSD: BigDecimal!
}

